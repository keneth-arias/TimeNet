yaml_schema_version: 1
dataset_id: airaware/lima-pm25-pm10-forecast
dataset_version: 0.1.0
name: Lima hourly PM2.5 and PM10 forecasting
description: >-
  Predict six hourly PM2.5 and PM10 concentrations from the previous 24 hours
  on seven provisional station identities. The historical cohort has 251,915
  training and 44,458 validation windows. The concentration unit is inferred.
  Individual reading quality, interval alignment and publication delays are unknown.
